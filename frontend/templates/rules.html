<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detection Rules | Cyber Sentinel X</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/soc.css') }}">
  <style>
    .rule-form {
      display:none;
      margin-bottom:18px;
      padding:20px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      background:rgba(255,255,255,.025);
    }
    .rule-form.active { display:block; }
    .rule-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .rule-field {
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .rule-field.full { grid-column:1/-1; }
    .rule-field label {
      font-size:11px;
      letter-spacing:.08em;
      opacity:.65;
    }
    .rule-field input,
    .rule-field select,
    .rule-field textarea {
      width:100%;
      box-sizing:border-box;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:8px;
      background:rgba(0,0,0,.25);
      color:inherit;
      outline:none;
    }
    .rule-field textarea { min-height:80px; resize:vertical; }
    .rule-actions {
      display:flex;
      gap:8px;
      margin-top:16px;
      flex-wrap:wrap;
    }
    .rule-error {
      display:none;
      margin-top:10px;
      color:#ff6b6b;
      font-size:12px;
    }
    @media (max-width:700px) {
      .rule-grid { grid-template-columns:1fr; }
      .rule-field.full { grid-column:auto; }
    }
  </style>
</head>

<body>
  <main style="padding:32px;max-width:1400px;margin:auto;">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap;">
      <div>
        <div class="csx-panel-kicker">MANAGE / DETECTION</div>
        <h1 style="margin:6px 0;">Detection Rule Manager</h1>
        <p style="opacity:.65;margin:0;">
          Configure and manage active security detection rules.
        </p>
      </div>

      <button id="addRuleBtn" class="csx-panel-tag">+ ADD RULE</button>
    </div>

    <section id="ruleForm" class="rule-form">
      <div class="csx-panel-kicker" id="formKicker">NEW DETECTION RULE</div>
      <h2 id="formTitle" style="margin:6px 0 18px;">Create Rule</h2>

      <form id="ruleEditor">
        <div class="rule-grid">

          <div class="rule-field">
            <label>RULE NAME</label>
            <input id="ruleName" type="text" maxlength="120" required>
          </div>

          <div class="rule-field">
            <label>CATEGORY</label>
            <input id="ruleCategory" type="text" maxlength="80" value="NETWORK_RISK">
          </div>

          <div class="rule-field full">
            <label>DESCRIPTION</label>
            <textarea id="ruleDescription" maxlength="500"></textarea>
          </div>

          <div class="rule-field">
            <label>SEVERITY</label>
            <select id="ruleSeverity">
              <option value="SUSPICIOUS">SUSPICIOUS</option>
              <option value="LOW">LOW</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH</option>
              <option value="CRITICAL">CRITICAL</option>
            </select>
          </div>

          <div class="rule-field">
            <label>RISK THRESHOLD</label>
            <input id="ruleThreshold" type="number" min="0" max="100" value="60" required>
          </div>

          <div class="rule-field">
            <label>STATUS</label>
            <select id="ruleEnabled">
              <option value="1">ENABLED</option>
              <option value="0">DISABLED</option>
            </select>
          </div>

        </div>

        <div id="formError" class="rule-error"></div>

        <div class="rule-actions">
          <button type="submit" class="csx-panel-tag" id="saveRuleBtn">SAVE RULE</button>
          <button type="button" class="csx-panel-tag" id="cancelRuleBtn">CANCEL</button>
        </div>
      </form>
    </section>

    <section class="csx-panel">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
        <div class="csx-panel-tag">TOTAL <span id="totalRules">0</span></div>
        <div class="csx-panel-tag">ENABLED <span id="enabledRules">0</span></div>
        <div class="csx-panel-tag">DISABLED <span id="disabledRules">0</span></div>
      </div>

      <div id="rulesList">
        <div style="opacity:.6;">Loading detection rules...</div>
      </div>
    </section>

  </main>

<script>
let editingRuleId = null;

async function loadRules() {
  const response = await fetch("/api/soc/rules");

  if (!response.ok) {
    throw new Error("Failed to load rules");
  }

  const rules = await response.json();

  document.getElementById("totalRules").textContent = rules.length;
  document.getElementById("enabledRules").textContent =
    rules.filter(r => Number(r.enabled) === 1).length;
  document.getElementById("disabledRules").textContent =
    rules.filter(r => Number(r.enabled) === 0).length;

  const container = document.getElementById("rulesList");

  if (!rules.length) {
    container.innerHTML =
      '<div style="opacity:.6;">No detection rules configured.</div>';
    return;
  }

  container.innerHTML = rules.map(rule => `
    <div style="
      border:1px solid rgba(255,255,255,.08);
      padding:16px;
      margin-bottom:10px;
      border-radius:10px;
      background:rgba(255,255,255,.025);
    ">
      <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <strong>${escapeHtml(rule.name)}</strong>
          <div style="font-size:12px;opacity:.55;margin-top:4px;">
            ${escapeHtml(rule.rule_id)} · ${escapeHtml(rule.category || "GENERAL")}
          </div>
        </div>

        <span>${Number(rule.enabled) === 1 ? "ENABLED" : "DISABLED"}</span>
      </div>

      <div style="margin-top:10px;font-size:13px;opacity:.7;">
        ${escapeHtml(rule.description || "No description")}
      </div>

      <div style="display:flex;gap:18px;margin-top:12px;font-size:12px;flex-wrap:wrap;">
        <span>SEVERITY: <b>${escapeHtml(rule.severity)}</b></span>
        <span>THRESHOLD: <b>${rule.threshold}</b></span>
      </div>

      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
        ${
          Number(rule.enabled) === 1
          ? `<button class="csx-panel-tag" onclick="toggleRule('${rule.rule_id}', false)">DISABLE</button>`
          : `<button class="csx-panel-tag" onclick="toggleRule('${rule.rule_id}', true)">ENABLE</button>`
        }

        <button class="csx-panel-tag" onclick='editRule(${JSON.stringify(rule)})'>
          EDIT
        </button>

        <button class="csx-panel-tag" onclick="deleteRule('${rule.rule_id}')">
          DELETE
        </button>
      </div>
    </div>
  `).join("");
}

function openCreateForm() {
  editingRuleId = null;

  document.getElementById("formKicker").textContent = "NEW DETECTION RULE";
  document.getElementById("formTitle").textContent = "Create Rule";
  document.getElementById("saveRuleBtn").textContent = "SAVE RULE";

  document.getElementById("ruleEditor").reset();
  document.getElementById("ruleCategory").value = "NETWORK_RISK";
  document.getElementById("ruleSeverity").value = "SUSPICIOUS";
  document.getElementById("ruleThreshold").value = "60";
  document.getElementById("ruleEnabled").value = "1";

  document.getElementById("formError").style.display = "none";
  document.getElementById("ruleForm").classList.add("active");
  document.getElementById("ruleName").focus();
}

function editRule(rule) {
  editingRuleId = rule.rule_id;

  document.getElementById("formKicker").textContent = "EDIT DETECTION RULE";
  document.getElementById("formTitle").textContent = "Update Rule";
  document.getElementById("saveRuleBtn").textContent = "UPDATE RULE";

  document.getElementById("ruleName").value = rule.name || "";
  document.getElementById("ruleCategory").value = rule.category || "NETWORK_RISK";
  document.getElementById("ruleDescription").value = rule.description || "";
  document.getElementById("ruleSeverity").value = rule.severity || "SUSPICIOUS";
  document.getElementById("ruleThreshold").value = rule.threshold ?? 0;
  document.getElementById("ruleEnabled").value = Number(rule.enabled) === 1 ? "1" : "0";

  document.getElementById("formError").style.display = "none";
  document.getElementById("ruleForm").classList.add("active");
  document.getElementById("ruleName").focus();
}

function closeRuleForm() {
  editingRuleId = null;
  document.getElementById("ruleForm").classList.remove("active");
  document.getElementById("ruleEditor").reset();
  document.getElementById("formError").style.display = "none";
}

async function saveRule(event) {
  event.preventDefault();

  const errorBox = document.getElementById("formError");
  errorBox.style.display = "none";

  const payload = {
    name: document.getElementById("ruleName").value.trim(),
    category: document.getElementById("ruleCategory").value.trim(),
    description: document.getElementById("ruleDescription").value.trim(),
    severity: document.getElementById("ruleSeverity").value,
    threshold: Number(document.getElementById("ruleThreshold").value),
    enabled: Number(document.getElementById("ruleEnabled").value)
  };

  if (!payload.name) {
    errorBox.textContent = "Rule name is required.";
    errorBox.style.display = "block";
    return;
  }

  if (!Number.isInteger(payload.threshold) || payload.threshold < 0 || payload.threshold > 100) {
    errorBox.textContent = "Threshold must be between 0 and 100.";
    errorBox.style.display = "block";
    return;
  }

  const url = editingRuleId
    ? `/api/soc/rules/${encodeURIComponent(editingRuleId)}`
    : "/api/soc/rules";

  const method = editingRuleId ? "PUT" : "POST";

  const response = await fetch(url, {
    method,
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    let message = "Failed to save rule.";

    try {
      const data = await response.json();
      message = data.error || data.message || message;
    } catch (_) {}

    errorBox.textContent = message;
    errorBox.style.display = "block";
    return;
  }

  closeRuleForm();
  await loadRules();
}

async function toggleRule(ruleId, enable) {
  const action = enable ? "enable" : "disable";

  const response = await fetch(
    `/api/soc/rules/${encodeURIComponent(ruleId)}/${action}`,
    {method: "PATCH"}
  );

  if (!response.ok) {
    alert("Failed to update rule.");
    return;
  }

  await loadRules();
}

async function deleteRule(ruleId) {
  if (!confirm("Delete this detection rule?")) return;

  const response = await fetch(
    `/api/soc/rules/${encodeURIComponent(ruleId)}`,
    {method: "DELETE"}
  );

  if (!response.ok) {
    alert("Failed to delete rule.");
    return;
  }

  await loadRules();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document.getElementById("addRuleBtn").addEventListener("click", openCreateForm);
document.getElementById("cancelRuleBtn").addEventListener("click", closeRuleForm);
document.getElementById("ruleEditor").addEventListener("submit", saveRule);

loadRules().catch(() => {
  document.getElementById("rulesList").innerHTML =
    '<div style="opacity:.6;">Unable to load detection rules.</div>';
});
</script>

</body>
</html>
