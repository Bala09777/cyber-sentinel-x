<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Sentinel X — PCAP Analysis</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: #e8f0ff;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 32px;
        }

        h1 { margin-bottom: 6px; }
        .subtitle { color: #8fa6c5; margin-bottom: 28px; }

        .panel {
            background: #0d1b2d;
            border: 1px solid #1d3553;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: #081525;
            color: #cfe0f7;
            border: 1px solid #294766;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        button {
            padding: 11px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            background: #1683ff;
            color: white;
            font-weight: bold;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 14px;
            color: #9db3cf;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .metric {
            background: #081525;
            border: 1px solid #1d3553;
            border-radius: 10px;
            padding: 18px;
        }

        .metric-label {
            color: #8fa6c5;
            font-size: 13px;
        }

        .metric-value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #19304b;
        }

        .empty {
            color: #7188a5;
            padding: 12px 0;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            color: #a9c7e8;
        }

        @media (max-width: 800px) {
            .grid, .columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>CYBER SENTINEL X — PCAP Analysis</h1>
    <div class="subtitle">
        Defensive packet capture investigation workspace
    </div>

    <div class="panel">
        <h2>Upload Capture</h2>

        <input
            type="file"
            id="pcapFile"
            accept=".pcap,.pcapng,.cap"
        >

        <button id="analyzeBtn" onclick="analyzePCAP()">
            Analyze PCAP
        </button>

        <div class="status" id="status">
            Select a PCAP / PCAPNG file to begin.
        </div>
    </div>

    <div id="results" style="display:none;">

        <div class="grid">
            <div class="metric">
                <div class="metric-label">PACKETS</div>
                <div class="metric-value" id="packetCount">0</div>
            </div>

            <div class="metric">
                <div class="metric-label">TOTAL BYTES</div>
                <div class="metric-value" id="totalBytes">0</div>
            </div>

            <div class="metric">
                <div class="metric-label">PROTOCOLS</div>
                <div class="metric-value" id="protocolCount">0</div>
            </div>

            <div class="metric">
                <div class="metric-label">CAPTURE FILE</div>
                <div class="metric-value" id="fileName">-</div>
            </div>
        </div>

        <br>

        <div class="columns">

            <div class="panel">
                <h2>Protocol Distribution</h2>
                <div id="protocols"></div>
            </div>

            <div class="panel">
                <h2>Top Source IPs</h2>
                <div id="sources"></div>
            </div>

            <div class="panel">
                <h2>Top Destination IPs</h2>
                <div id="destinations"></div>
            </div>

            <div class="panel">
                <h2>Top Ports</h2>
                <div id="ports"></div>
            </div>

        </div>

        <div class="panel">
            <h2>Analysis Data</h2>
            <pre id="rawData"></pre>
        </div>

    </div>

</div>

<script>
async function analyzePCAP() {
    const input = document.getElementById("pcapFile");
    const button = document.getElementById("analyzeBtn");
    const status = document.getElementById("status");

    if (!input.files.length) {
        status.textContent = "Please select a PCAP file.";
        return;
    }

    const formData = new FormData();
    formData.append("file", input.files[0]);

    button.disabled = true;
    status.textContent = "Analyzing capture...";

    try {
        const response = await fetch("/api/pcap/analyze", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok || data.status !== "success") {
            throw new Error(data.error || "PCAP analysis failed");
        }

        renderResults(data.analysis);
        status.textContent = "Analysis completed successfully.";
    } catch (error) {
        status.textContent = "Error: " + error.message;
        document.getElementById("results").style.display = "none";
    } finally {
        button.disabled = false;
    }
}

function renderResults(data) {
    document.getElementById("results").style.display = "block";

    document.getElementById("packetCount").textContent =
        Number(data.packet_count || 0).toLocaleString();

    document.getElementById("totalBytes").textContent =
        Number(data.total_bytes || 0).toLocaleString();

    document.getElementById("fileName").textContent =
        data.file || "-";

    const protocols = data.protocol_distribution || {};
    document.getElementById("protocolCount").textContent =
        Object.keys(protocols).length;

    renderMap("protocols", protocols);
    renderPairs("sources", data.top_source_ips || []);
    renderPairs("destinations", data.top_destination_ips || []);

    const ports = [
        ...(data.top_source_ports || []).map(x => ["SRC " + x[0], x[1]]),
        ...(data.top_destination_ports || []).map(x => ["DST " + x[0], x[1]])
    ];

    renderPairs("ports", ports);

    document.getElementById("rawData").textContent =
        JSON.stringify(data, null, 2);
}

function renderMap(id, obj) {
    const el = document.getElementById(id);
    el.innerHTML = "";

    const entries = Object.entries(obj);

    if (!entries.length) {
        el.innerHTML = '<div class="empty">No data</div>';
        return;
    }

    entries.forEach(([key, value]) => {
        const row = document.createElement("div");
        row.className = "list-item";
        row.innerHTML = `<span>${escapeHTML(key)}</span><strong>${value}</strong>`;
        el.appendChild(row);
    });
}

function renderPairs(id, items) {
    const el = document.getElementById(id);
    el.innerHTML = "";

    if (!items.length) {
        el.innerHTML = '<div class="empty">No data</div>';
        return;
    }

    items.forEach(item => {
        const row = document.createElement("div");
        row.className = "list-item";
        row.innerHTML =
            `<span>${escapeHTML(String(item[0]))}</span>
             <strong>${Number(item[1]).toLocaleString()}</strong>`;
        el.appendChild(row);
    });
}

function escapeHTML(value) {
    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
