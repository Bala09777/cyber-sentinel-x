<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b14"><title>Secure Login — Cyber Sentinel X</title>
<style>
:root{color-scheme:dark;--cyan:#36d9fa;--text:#e9f8ff;--muted:#8eacc2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 60% 25%,rgba(20,98,151,.18),transparent 35%),linear-gradient(135deg,#040912,#071525);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:25px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(54,217,250,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(54,217,250,.027) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse at center,#000,transparent 80%)}.login-wrapper{width:min(100%,440px);position:relative}.login-tag{display:block;text-align:center;font-size:11px;letter-spacing:.19em;color:#7295aa;font-weight:750;margin-bottom:18px}.login-box{background:linear-gradient(155deg,rgba(12,34,52,.97),rgba(6,17,30,.97));border:1px solid rgba(65,192,236,.24);box-shadow:0 35px 100px rgba(0,0,0,.4),0 0 65px rgba(25,156,210,.07);padding:39px 38px;border-radius:22px;position:relative;overflow:hidden}.login-box:before{content:"";position:absolute;top:0;left:0;width:70%;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}.brand-logo{width:68px;height:68px;margin:0 auto 22px;border:1px solid rgba(54,217,250,.32);border-radius:20px;background:rgba(54,217,250,.07);display:grid;place-items:center;box-shadow:0 0 45px rgba(54,217,250,.09)}.brand-logo svg{width:40px;height:40px;fill:none;stroke:var(--cyan);stroke-width:1.6;filter:drop-shadow(0 0 8px rgba(54,217,250,.36))}h1{text-align:center;font-size:21px;letter-spacing:.08em;margin:0 0 6px}h1 span{color:var(--cyan)}.subtitle{text-align:center;color:var(--muted);font-size:12px;margin:0 0 33px}.form-label{display:block;color:#92b5c8;font-weight:770;letter-spacing:.13em;font-size:10px;margin:18px 0 9px}input{display:block;width:100%;border:1px solid rgba(79,170,205,.22);border-radius:10px;padding:14px 15px;background:rgba(4,17,29,.7);color:#edfaff;font-size:13px;outline:none;transition:border-color .2s}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(54,217,250,.07)}button{width:100%;border:1px solid rgba(54,217,250,.35);border-radius:10px;background:linear-gradient(95deg,#16accb,#117cbd);padding:14px;color:#f1fdff;font-weight:790;font-size:12px;letter-spacing:.08em;margin-top:24px;cursor:pointer;transition:.2s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}.error{color:#ff8ca0;font-size:12px;min-height:20px;text-align:center;margin-top:18px}.login-footer{text-align:center;font-size:10px;letter-spacing:.09em;color:#66879c;margin:25px 0 0}.login-footer span{color:#65e6be}@media(max-width:480px){.login-box{padding:32px 23px}}
</style></head><body>
<div class="login-wrapper"><span class="login-tag">SECURE SECURITY OPERATIONS ACCESS</span><main class="login-box"><div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></div><h1>CYBER SENTINEL <span>X</span></h1><p class="subtitle">Sign in to your local Security Operations Center</p><form id="loginForm"><label class="form-label" for="username">OPERATOR USERNAME</label><input id="username" type="text" placeholder="Username" required maxlength="120" autocomplete="username" autofocus><label class="form-label" for="password">PASSWORD</label><input id="password" type="password" placeholder="••••••••" required autocomplete="current-password"><button type="submit" id="loginButton">ACCESS SOC DASHBOARD →</button></form><div class="error" id="error" role="alert" aria-live="polite"></div></main><div class="login-footer"><span>●</span> LOCAL DEFENSIVE MONITORING · AUTHENTICATED ACCESS</div></div>
<script>document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('loginButton'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const result=await response.json();if(response.ok&&result.success){window.location.href='/';return;}error.textContent=result.error||'Authentication failed';}catch{error.textContent='Unable to connect to authentication service';}finally{button.disabled=false;}});</script></body></html>
