<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SENTINEL X — Investigation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/soc.css') }}">

    <style>
        body {
            background:
                linear-gradient(
                    90deg,
                    rgba(2, 7, 18, .96),
                    rgba(4, 12, 28, .90),
                    rgba(2, 6, 16, .96)
                ),
                url("{{ url_for('static', filename='assets/soc-bg.png') }}")
                center / cover fixed no-repeat;
            color: #e5f7ff;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .investigation-page {
            max-width: 1500px;
            margin: auto;
            padding: 28px;
        }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .inv-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .inv-subtitle {
            color: #7f9bb0;
            margin-top: 6px;
        }

        .inv-status {
            padding: 8px 14px;
            border: 1px solid rgba(34,211,238,.35);
            border-radius: 20px;
            color: #22d3ee;
            background: rgba(34,211,238,.08);
        }

        .inv-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px;
        }

        .inv-card {
            background: rgba(5,13,28,.78);
            border: 1px solid rgba(70,210,255,.16);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
        }

        .inv-card h2 {
            font-size: 15px;
            letter-spacing: 1.5px;
            margin-top: 0;
            color: #8bdff5;
        }

        .incident-main {
            grid-column: 1 / -1;
        }

        .severity {
            color: #ff4d67;
            font-weight: 800;
        }

        .risk {
            font-size: 42px;
            font-weight: 900;
        }

        .risk-label {
            color: #7f9bb0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            background: rgba(255,255,255,.025);
            border: 1px solid rgba(255,255,255,.06);
            padding: 14px;
            border-radius: 10px;
        }

        .detail-label {
            color: #6f899c;
            font-size: 11px;
            text-transform: uppercase;
        }

        .detail-value {
            margin-top: 7px;
            font-weight: 700;
            word-break: break-word;
        }

        .timeline {
            margin-top: 10px;
        }

        .event {
            display: grid;
            grid-template-columns: 170px 1fr auto;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .event:last-child {
            border-bottom: 0;
        }

        .event-time {
            color: #7892a5;
            font-size: 12px;
        }

        .event-id {
            color: #22d3ee;
            font-size: 12px;
        }

        .event-activity {
            font-weight: 700;
            margin-top: 4px;
        }

        .event-risk {
            font-weight: 800;
            color: #ff6b6b;
        }

        .empty {
            color: #7892a5;
            padding: 20px 0;
        }

        .refresh {
            color: #7892a5;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .inv-grid,
            .details {
                grid-template-columns: 1fr;
            }

            .event {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="investigation-page">

    <header class="inv-header">
        <div>
            <div class="inv-title">CYBER SENTINEL X</div>
            <div class="inv-subtitle">Security Investigation Workspace</div>
        </div>

        <div class="inv-status" id="status">
            CONNECTING
        </div>
    </header>

    <div class="inv-grid">

        <section class="inv-card incident-main">
            <h2>INCIDENT OVERVIEW</h2>

            <div id="incident">
                Loading incident...
            </div>
        </section>

        <section class="inv-card">
            <h2>RISK ANALYSIS</h2>

            <div class="risk" id="riskScore">--</div>
            <div class="risk-label">RISK SCORE / 100</div>

            <div style="margin-top:20px;">
                <div id="severity">Severity: --</div>
                <div id="attackType" style="margin-top:8px;">
                    Attack Type: --
                </div>
            </div>
        </section>

        <section class="inv-card">
            <h2>NETWORK CONTEXT</h2>

            <div id="source">Source: --</div>
            <div id="destination" style="margin-top:12px;">
                Destination: --
            </div>
        </section>

        <section class="inv-card incident-main">
            <h2>EVENT TIMELINE</h2>

            <div class="refresh">
                Correlated security events
            </div>

            <div class="timeline" id="timeline">
                Loading timeline...
            </div>
        </section>

    </div>

</div>

<script>

const INCIDENT_ID =
    "INC-20260904192625-B2FDCBC2";

async function loadInvestigation() {

    try {

        const incidentResponse =
            await fetch(
                "/api/incidents/" + INCIDENT_ID
            );

        const incident =
            await incidentResponse.json();

        if (incidentResponse.ok) {

            document.getElementById("status")
                .textContent = incident.status;

            document.getElementById("incident")
                .innerHTML =
                "<strong>" + incident.title + "</strong>" +
                "<div style='margin-top:10px;color:#7892a5'>" +
                incident.description +
                "</div>";

            document.getElementById("riskScore")
                .textContent = incident.risk_score;

            document.getElementById("severity")
                .innerHTML =
                "Severity: <span class='severity'>" +
                incident.severity +
                "</span>";

            document.getElementById("attackType")
                .textContent =
                "Attack Type: " + incident.attack_type;

            document.getElementById("source")
                .textContent =
                "Source: " + incident.source_ip;

            document.getElementById("destination")
                .textContent =
                "Destination: " + incident.destination_ip;
        }

        const timelineResponse =
            await fetch(
                "/api/incidents/" +
                INCIDENT_ID +
                "/timeline"
            );

        const events =
            await timelineResponse.json();

        const timeline =
            document.getElementById("timeline");

        if (!events.length) {
            timeline.innerHTML =
                "<div class='empty'>No correlated events found.</div>";
            return;
        }

        timeline.innerHTML =
            events.map(event => `
                <div class="event">

                    <div class="event-time">
                        ${event.created_at}
                    </div>

                    <div>
                        <div class="event-id">
                            ${event.event_id}
                        </div>

                        <div class="event-activity">
                            ${event.activity}
                        </div>

                        <div style="margin-top:6px;color:#7892a5;">
                            ${event.source_ip}
                            → ${event.destination_ip}
                            · ${event.protocol}
                        </div>
                    </div>

                    <div class="event-risk">
                        ${event.risk_score}
                    </div>

                </div>
            `).join("");

    } catch (error) {

        document.getElementById("status")
            .textContent = "OFFLINE";

        console.error(error);
    }
}

loadInvestigation();

setInterval(loadInvestigation, 10000);

</script>

</body>
</html>
