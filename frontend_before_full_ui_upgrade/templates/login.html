<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Sentinel X — Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07111f;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: rgba(15, 30, 50, 0.95);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.15);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8ea3b8;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #29445e;
            border-radius: 8px;
            background: #0b1b2d;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: 0;
            border-radius: 8px;
            background: #1683ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #error {
            color: #ff6b6b;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>CYBER SENTINEL X</h1>
    <div class="subtitle">Security Operations Platform</div>

    <form id="loginForm">
        <input id="username" type="text" placeholder="Username" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">SIGN IN</button>
    </form>

    <div id="error"></div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const error = document.getElementById("error");

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            window.location.href = "/";
        } else {
            error.textContent = result.error || "Login failed";
        }

    } catch (err) {
        error.textContent = "Authentication service unavailable";
    }
});
</script>

</body>
</html>
