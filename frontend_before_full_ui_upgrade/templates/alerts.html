<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Sentinel X — Alert Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top right, #102b46 0%, #07111f 40%),
                #07111f;
            color: #e8f1fb;
            font-family: Arial, sans-serif;
        }

        .topbar {
            padding: 24px 32px;
            border-bottom: 1px solid #1b344d;
            background: rgba(7, 17, 31, 0.95);
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 25px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 7px;
            color: #8ca4ba;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 28px 32px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 22px;
        }

        .card {
            background: rgba(12, 29, 48, 0.88);
            border: 1px solid #1d3852;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .card-label {
            color: #8ca4ba;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.8px;
        }

        .card-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
        }

        .critical-value {
            color: #ff7180;
        }

        .high-value {
            color: #ffb45c;
        }

        .suspicious-value {
            color: #ffe16b;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(12, 29, 48, 0.78);
            border: 1px solid #1d3852;
            border-radius: 12px;
        }

        select {
            background: #0b1b2d;
            color: #dceafa;
            border: 1px solid #29445e;
            border-radius: 8px;
            padding: 9px 12px;
            outline: none;
        }

        .refresh-btn {
            margin-left: auto;
            padding: 9px 15px;
            border: 1px solid #315a78;
            border-radius: 8px;
            background: #102a40;
            color: #8fd3ff;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #163b59;
        }

        .refresh-status {
            color: #7089a0;
            font-size: 12px;
        }

        .alert {
            background: rgba(12, 29, 48, 0.9);
            border: 1px solid #1d3852;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .alert:hover {
            border-color: #315a78;
            transform: translateY(-1px);
        }

        .alert-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .alert-title {
            font-weight: bold;
            font-size: 17px;
        }

        .alert-id {
            margin-top: 5px;
            color: #7089a0;
            font-size: 11px;
        }

        .badge {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .critical {
            background: #5b1720;
            color: #ff7180;
        }

        .high {
            background: #5a3512;
            color: #ffb45c;
        }

        .suspicious {
            background: #514615;
            color: #ffe16b;
        }

        .normal {
            background: #163c2d;
            color: #7ee2ad;
        }

        .details {
            margin-top: 17px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 25px;
            color: #9eb2c5;
            font-size: 13px;
            line-height: 1.6;
        }

        .detail-box {
            padding: 10px 12px;
            background: rgba(5, 15, 27, 0.45);
            border-radius: 8px;
            border: 1px solid rgba(38, 65, 89, 0.5);
        }

        .detail-box strong {
            color: #d8e7f5;
        }

        .risk-section {
            margin-top: 15px;
        }

        .risk-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .risk {
            font-weight: bold;
            color: #ff7180;
        }

        .risk-bar {
            height: 7px;
            background: #172b3d;
            border-radius: 10px;
            overflow: hidden;
        }

        .risk-fill {
            height: 100%;
            background: #ff7180;
            border-radius: 10px;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .ack-btn {
            border: 1px solid #315a78;
            background: #102a40;
            color: #8fd3ff;
        }

        .close-btn {
            border: 1px solid #63313a;
            background: #35151b;
            color: #ff8b98;
        }

        .action-btn:hover {
            filter: brightness(1.2);
        }

        .status {
            display: inline-block;
            margin-left: 5px;
            padding: 3px 7px;
            border-radius: 6px;
            background: #182b3d;
            color: #9eb2c5;
            font-size: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #7f95aa;
            background: rgba(12, 29, 48, 0.65);
            border: 1px solid #1d3852;
            border-radius: 14px;
        }

        .loading {
            color: #8ca4ba;
            padding: 40px;
            text-align: center;
        }

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .details {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .refresh-btn {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<div class="topbar">

    <div class="title">
        ⚠ Security Alert Center
    </div>

    <div class="subtitle">
        Cyber Sentinel X — Real-Time Security Monitoring & Alert Management
    </div>

</div>


<div class="container">

    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">
            <div class="card-label">TOTAL ALERTS</div>
            <div class="card-value" id="totalAlerts">0</div>
        </div>

        <div class="card">
            <div class="card-label">CRITICAL</div>
            <div class="card-value critical-value" id="criticalAlerts">0</div>
        </div>

        <div class="card">
            <div class="card-label">HIGH</div>
            <div class="card-value high-value" id="highAlerts">0</div>
        </div>

        <div class="card">
            <div class="card-label">SUSPICIOUS</div>
            <div class="card-value suspicious-value" id="suspiciousAlerts">0</div>
        </div>

    </div>


    <!-- FILTER TOOLBAR -->

    <div class="toolbar">

        <select id="severityFilter" onchange="loadAlerts()">
            <option value="ALL">All Severities</option>
            <option value="CRITICAL">Critical</option>
            <option value="HIGH">High</option>
            <option value="SUSPICIOUS">Suspicious</option>
        </select>

        <select id="statusFilter" onchange="loadAlerts()">
            <option value="ALL">All Status</option>
            <option value="OPEN">Open</option>
            <option value="ACKNOWLEDGED">Acknowledged</option>
            <option value="CLOSED">Closed</option>
        </select>

        <span class="refresh-status" id="refreshStatus">
            Auto refresh: 5s
        </span>

        <button class="refresh-btn" onclick="loadAlerts()">
            ↻ Refresh
        </button>

    </div>


    <!-- ALERT LIST -->

    <div id="alertsContainer">

        <div class="loading">
            Loading security alerts...
        </div>

    </div>

</div>


<script>

let allAlerts = [];


async function loadAlerts() {

    const container =
        document.getElementById("alertsContainer");

    try {

        const response =
            await fetch("/api/soc/alerts", {
                credentials: "same-origin"
            });

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const result =
            await response.json();

        allAlerts =
            result.alerts || [];


        updateSummary(allAlerts);


        const severity =
            document.getElementById(
                "severityFilter"
            ).value;

        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            allAlerts.filter(alert => {

                const severityMatch =
                    severity === "ALL" ||
                    alert.severity === severity;

                const statusMatch =
                    status === "ALL" ||
                    alert.status === status;

                return severityMatch &&
                       statusMatch;

            });


        renderAlerts(filtered);


        document.getElementById(
            "refreshStatus"
        ).textContent =
            "Updated: " +
            new Date().toLocaleTimeString();

    }

    catch (error) {

        console.error(
            "Alert loading failed:",
            error
        );

        container.innerHTML =
            '<div class="empty">Unable to load security alerts.</div>';

    }

}


function updateSummary(alerts) {

    document.getElementById(
        "totalAlerts"
    ).textContent =
        alerts.length;


    document.getElementById(
        "criticalAlerts"
    ).textContent =
        alerts.filter(
            a => a.severity === "CRITICAL"
        ).length;


    document.getElementById(
        "highAlerts"
    ).textContent =
        alerts.filter(
            a => a.severity === "HIGH"
        ).length;


    document.getElementById(
        "suspiciousAlerts"
    ).textContent =
        alerts.filter(
            a => a.severity === "SUSPICIOUS"
        ).length;

}


function renderAlerts(alerts) {

    const container =
        document.getElementById(
            "alertsContainer"
        );


    if (!alerts.length) {

        container.innerHTML =
            '<div class="empty">No alerts match the selected filters.</div>';

        return;

    }


    container.innerHTML =
        alerts.map(alert => {

            const severity =
                String(
                    alert.severity || "UNKNOWN"
                ).toLowerCase();


            const risk =
                Number(
                    alert.risk_score || 0
                );


            const status =
                String(
                    alert.status || "OPEN"
                ).toUpperCase();


            return `

                <div class="alert">

                    <div class="alert-head">

                        <div>

                            <div class="alert-title">
                                ${alert.title || "Security Alert"}
                            </div>

                            <div class="alert-id">
                                ${alert.alert_id || "-"}
                            </div>

                        </div>

                        <div class="badge ${severity}">
                            ${alert.severity || "UNKNOWN"}
                        </div>

                    </div>


                    <div class="details">

                        <div class="detail-box">

                            <strong>Network Path</strong><br>

                            ${alert.source_ip || "-"}
                            →
                            ${alert.destination_ip || "-"}

                        </div>


                        <div class="detail-box">

                            <strong>Status</strong><br>

                            ${status}

                        </div>


                        <div class="detail-box">

                            <strong>Detection Time</strong><br>

                            ${alert.timestamp || "-"}

                        </div>


                        <div class="detail-box">

                            <strong>Event ID</strong><br>

                            ${alert.event_id || "-"}

                        </div>

                    </div>


                    <div class="risk-section">

                        <div class="risk-row">

                            <span>
                                Risk Score
                            </span>

                            <span class="risk">
                                ${risk}/100
                            </span>

                        </div>

                        <div class="risk-bar">

                            <div
                                class="risk-fill"
                                style="width:${Math.min(risk, 100)}%"
                            ></div>

                        </div>

                    </div>


                    <div class="details">

                        <div
                            class="detail-box"
                            style="grid-column:1/-1;"
                        >

                            <strong>Detection Message</strong><br>

                            ${alert.message || "-"}

                        </div>

                    </div>


                    <div class="actions">

                        ${
                            status !== "ACKNOWLEDGED" &&
                            status !== "CLOSED"
                            ?

                            `<button
                                class="action-btn ack-btn"
                                onclick="acknowledgeAlert(${alert.id})"
                            >
                                ✓ Acknowledge
                            </button>`

                            :

                            ""
                        }


                        ${
                            status !== "CLOSED"
                            ?

                            `<button
                                class="action-btn close-btn"
                                onclick="closeAlert(${alert.id})"
                            >
                                ✕ Close
                            </button>`

                            :

                            ""
                        }

                    </div>

                </div>

            `;

        }).join("");

}


async function acknowledgeAlert(alertId) {

    try {

        const response =
            await fetch(
                `/api/soc/alerts/${alertId}/acknowledge`,
                {
                    method: "POST",
                    credentials: "same-origin"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Unable to acknowledge alert"
            );

            return;

        }


        await loadAlerts();

    }

    catch (error) {

        console.error(
            "Acknowledge failed:",
            error
        );

        alert(
            "Unable to acknowledge alert"
        );

    }

}


async function closeAlert(alertId) {

    if (
        !confirm(
            "Close this security alert?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/soc/alerts/${alertId}/close`,
                {
                    method: "POST",
                    credentials: "same-origin"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Unable to close alert"
            );

            return;

        }


        await loadAlerts();

    }

    catch (error) {

        console.error(
            "Close failed:",
            error
        );

        alert(
            "Unable to close alert"
        );

    }

}


loadAlerts();


setInterval(
    loadAlerts,
    5000
);

</script>

</body>
</html>
